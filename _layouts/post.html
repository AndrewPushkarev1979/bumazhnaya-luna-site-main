<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} — Бумажная Луна</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <meta name="description" content="{{ page.excerpt | strip_html | truncatewords: 20 }}">
</head>
<body>
    <header>
        <!-- твой существующий хедер -->
        <!-- (лучше вынести его в отдельный include, но пока можно скопировать) -->
    </header>

    <main class="post-page">
        <div class="container">
            <article>
                <header class="post-header">
                    <h1>{{ page.title }}</h1>
                    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>
                </header>
                <div class="post-content">
                    {{ content }}
                </div>
            </article>
        </div>
    </main>

    <footer>
        <!-- твой существующий футер -->
    </footer>

    <script>
        // твой скрипт мобильного меню
    </script>
</body>
</html>
